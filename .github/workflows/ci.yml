name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python
        run: python3 -m compileall -q start.py scripts

      - name: Verify repository and security rules
        run: python3 scripts/verify.py

      - name: Smoke-test the static server
        run: python3 scripts/smoke.py

      - name: Check JavaScript syntax
        run: find public/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run parser and export tests
        run: node --test tests/*.test.mjs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: docker compose config >/dev/null

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: onegate-config-compare:ci
